<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="340" viewBox="0 0 1200 340"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">eksTestSite — EKS local com serviços AWS emulados</title>
  <desc id="hero-desc">Título do projeto à esquerda e, à direita, saída real do comando make test com todas as validações ponta a ponta passando.</desc>

  <rect width="1200" height="340" rx="26" fill="#0B0E14"/>

  <!-- filete superior temático: laranja AWS no canto -->
  <rect x="56" y="0" width="72" height="4" rx="2" fill="#FF9900"/>

  <!-- ── coluna esquerda: título ─────────────────────────────── -->
  <g id="title-block" transform="translate(56 52)">
    <text x="0" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="17" letter-spacing="3" fill="#8B95A5">EKS LOCAL · SERVIÇOS AWS EMULADOS · 100% TERRAFORM</text>

    <text x="0" y="88" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="62" font-weight="700" fill="#E8ECF1">eksTestSite</text>

    <text x="0" y="136" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="22" fill="#C6CFDB">Um cluster EKS real (k3s em Docker) com ArgoCD, Karpenter,</text>
    <text x="0" y="166" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="22" fill="#C6CFDB">ALB, SQS/SNS, ECR e Kafka emulados — para validar fluxos</text>
    <text x="0" y="196" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="22" fill="#C6CFDB">ponta a ponta sem custo e sem conta AWS.</text>

    <text x="0" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="17" fill="#8B95A5">endpoint <tspan fill="#FF9900">localhost:4566</tspan>  ·  região us-east-1  ·  conta 000000000000</text>
  </g>

  <!-- ── coluna direita: prova (saída real do make test) ─────── -->
  <g id="terminal-proof" transform="translate(700 44)">
    <rect x="0" y="0" width="444" height="288" rx="14" fill="#11151C" stroke="#232D3D" stroke-width="1.5"/>

    <!-- barra da janela -->
    <circle cx="26" cy="24" r="5.5" fill="#3A4453"/>
    <circle cx="46" cy="24" r="5.5" fill="#3A4453"/>
    <circle cx="66" cy="24" r="5.5" fill="#3A4453"/>
    <text x="222" y="30" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" fill="#8B95A5">make test</text>
    <line x1="0" y1="46" x2="444" y2="46" stroke="#232D3D" stroke-width="1.5"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
      <text x="24" y="80"><tspan fill="#FF9900">$</tspan> <tspan fill="#E8ECF1">make test</tspan></text>

      <text x="24" y="114" fill="#8B95A5">apigw  → lambda proxy   <tspan fill="#3FB950">HTTP 200</tspan></text>
      <text x="24" y="142" fill="#8B95A5">alb    → api → lambda  <tspan fill="#3FB950">HTTP 200</tspan></text>
      <text x="24" y="170" fill="#8B95A5">alb    → app-web       <tspan fill="#3FB950">HTTP 200</tspan></text>
      <text x="24" y="198" fill="#8B95A5">sns    → sqs probe     <tspan fill="#3FB950">received</tspan></text>
      <text x="24" y="226" fill="#8B95A5">dlq    → redrive ×3    <tspan fill="#3FB950">moved</tspan></text>
      <text x="24" y="254" fill="#8B95A5">kafka  → rpk topic     <tspan fill="#3FB950">OK</tspan></text>
    </g>

    <!-- cursor -->
    <rect x="24" y="264" width="10" height="18" fill="#FF9900" opacity="0.9"/>
  </g>
</svg>
