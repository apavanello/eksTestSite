# Application do ArgoCD para o app de teste.
# Aplicar (com o repo já no GitHub): kubectl apply -f k8s/argocd/app-web-application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-web
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/apavanello/eksTestSite.git
    targetRevision: main
    path: k8s/app
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
