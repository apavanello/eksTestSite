apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-web
  namespace: app
  labels:
    app.kubernetes.io/name: app-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: app-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app-web
    spec:
      containers:
        - name: web
          # ECR local via mirror do containerd (registries.yaml do k3s)
          image: 000000000000.dkr.ecr.us-east-1.amazonaws.com/ministack-app-web:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
