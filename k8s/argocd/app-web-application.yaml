# Application do ArgoCD para o app de teste.
# Uso: substitua <REMOTE_URL> pela URL do repo (ex.: git@github.com:user/eksTestSite.git)
# e aplique: kubectl apply -f k8s/argocd/app-web-application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-web
  namespace: argocd
spec:
  project: default
  source:
    repoURL: <REMOTE_URL>
    targetRevision: main
    path: k8s/app
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
